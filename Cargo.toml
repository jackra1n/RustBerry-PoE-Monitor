[package]
name = "rustberry-poe-monitor"
version = "1.2.0"
edition = "2021"
authors = ["jackra1n"]
description = "A simple PoE Monitor for Raspberry Pi Waveshare PoE HAT (B)"
repository = "https://github.com/jackra1n/RustBerry-PoE-Monitor"
readme = "README.md"
license = "GPL-3.0"

[[bin]]
name = "rustberry-poe-monitor"

[dependencies]
ssd1306 = "0.10"
embedded-graphics = "0.8.1"
linux-embedded-hal = { version = "0.4", default-features = false, features = ["i2c"] }
profont = "0.7.0"
log = "0.4.20"
env_logger = { version = "0.11.3", default-features = false }
pcf857x = "0.5.0"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
serde = { version = "1.0.219", features = ["derive"] }
libc = "0.2.190"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
